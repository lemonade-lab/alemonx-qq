name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      luckylillia_e2e:
        description: 'Run the real LuckyLillia validation on the dedicated Linux ARM64 host'
        required: false
        type: boolean
        default: false
      napcat_runtime_check:
        description: 'Run the full real NapCat lifecycle E2E on approved Windows/Linux host(s)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Cross-compile check
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/alemonx-qq-linux ./runner
          GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/alemonx-qq-linux-arm64 ./runner
          GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/alemonx-qq-windows.exe ./runner
          GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/alemonx-qq-darwin ./runner
      - name: Validate alx.json
        run: go run ./cmd/alx-ci validate-manifest alx.json
      - name: Set manifest version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: go run ./cmd/alx-ci set-version "$GITHUB_REF_NAME"
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: go run ./cmd/alx-ci verify-version "$GITHUB_REF_NAME"
      - name: Validate reviewed runtime evidence
        run: |
          go run ./cmd/alx-ci evidence check-tree
          go test ./cmd/alx-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --non-interactive && yarn build
        working-directory: frontend
  web:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --non-interactive && yarn build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, bundle_platform: windows-amd64, lucky_platform: windows-amd64, napcat_platform: windows-amd64, binary: alemonx-qq-windows-amd64.exe, bundle: alemonx-qq-windows-amd64.zip }
          - { goos: darwin, goarch: arm64, bundle_platform: darwin-arm64, lucky_platform: darwin-arm64, napcat_platform: unsupported, binary: alemonx-qq-darwin-arm64, bundle: alemonx-qq-darwin-arm64.zip }
          - { goos: darwin, goarch: amd64, bundle_platform: darwin-amd64, lucky_platform: unsupported, napcat_platform: unsupported, binary: alemonx-qq-darwin-amd64, bundle: alemonx-qq-darwin-amd64.zip }
          - { goos: linux, goarch: amd64, bundle_platform: linux-amd64, lucky_platform: linux-amd64, napcat_platform: linux-amd64, binary: alemonx-qq-linux-amd64, bundle: alemonx-qq-linux-amd64.zip }
          - { goos: linux, goarch: arm64, bundle_platform: linux-arm64, lucky_platform: linux-arm64, napcat_platform: linux-arm64, binary: alemonx-qq-linux-arm64, bundle: alemonx-qq-linux-arm64.zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web
      - name: Set manifest version from tag
        run: go run ./cmd/alx-ci set-version "$GITHUB_REF_NAME"
      - name: Build plugin bundle
        run: |
          mkdir -p "bundle/alemonx-qq/dist" release
          lucky_evidence="$(go run ./cmd/alx-ci evidence encode luckylillia ${{ matrix.lucky_platform }})"
          napcat_evidence="$(go run ./cmd/alx-ci evidence encode napcat ${{ matrix.napcat_platform }})"
          go run ./cmd/alx-ci evidence prepare-manifest ${{ matrix.bundle_platform }} alx.json "bundle/alemonx-qq/alx.json"
          cp -r web "bundle/alemonx-qq/web"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.luckyReleaseValidationEvidence=$lucky_evidence -X main.napcatReleaseValidationEvidence=$napcat_evidence" -o "bundle/alemonx-qq/dist/${{ matrix.binary }}" ./runner
          (cd bundle && zip -r "../release/${{ matrix.bundle }}" alemonx-qq)
          (cd release && sha256sum "${{ matrix.bundle }}" > "${{ matrix.bundle }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          pattern: '*.zip'
      - run: |
          cat release/*.sha256 > release/SHA256SUMS
          rm release/*.sha256
          gh release create "${GITHUB_REF_NAME}" release/*.zip release/SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  luckylillia-e2e-linux-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.luckylillia_e2e
    runs-on: [self-hosted, linux, arm64, luckylillia-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify official package and record runtime evidence
        run: go run ./cmd/alx-ci verify-lucky-e2e
        env:
          LUCKYLILLIA_PLATFORM: linux-arm64
          LUCKYLILLIA_E2E_COMMAND_JSON: ${{ vars.LUCKYLILLIA_E2E_COMMAND_JSON_LINUX_ARM64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: luckylillia-linux-arm64-validation
          path: artifacts/luckylillia-validation.json

  luckylillia-e2e-linux-amd64:
    if: github.event_name == 'workflow_dispatch' && inputs.luckylillia_e2e
    runs-on: [self-hosted, linux, x64, luckylillia-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go run ./cmd/alx-ci verify-lucky-e2e
        env:
          LUCKYLILLIA_PLATFORM: linux-amd64
          LUCKYLILLIA_E2E_COMMAND_JSON: ${{ vars.LUCKYLILLIA_E2E_COMMAND_JSON_LINUX_AMD64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: luckylillia-linux-amd64-validation
          path: artifacts/luckylillia-validation.json

  luckylillia-e2e-windows-amd64:
    if: github.event_name == 'workflow_dispatch' && inputs.luckylillia_e2e
    runs-on: [self-hosted, windows, x64, luckylillia-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go run ./cmd/alx-ci verify-lucky-e2e
        env:
          LUCKYLILLIA_PLATFORM: windows-amd64
          LUCKYLILLIA_E2E_COMMAND_JSON: ${{ vars.LUCKYLILLIA_E2E_COMMAND_JSON_WINDOWS_AMD64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: luckylillia-windows-amd64-validation
          path: artifacts/luckylillia-validation.json

  luckylillia-e2e-darwin-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.luckylillia_e2e
    runs-on: [self-hosted, macos, arm64, luckylillia-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go run ./cmd/alx-ci verify-lucky-e2e
        env:
          LUCKYLILLIA_PLATFORM: darwin-arm64
          LUCKYLILLIA_E2E_COMMAND_JSON: ${{ vars.LUCKYLILLIA_E2E_COMMAND_JSON_DARWIN_ARM64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: luckylillia-darwin-arm64-validation
          path: artifacts/luckylillia-validation.json

  napcat-e2e-windows-amd64:
    if: github.event_name == 'workflow_dispatch' && inputs.napcat_runtime_check
    runs-on: [self-hosted, windows, x64, napcat-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Run full Windows NapCat lifecycle validation
        run: go run ./cmd/alx-ci verify-napcat-e2e
        env:
          NAPCAT_PLATFORM: windows-amd64
          NAPCAT_E2E_COMMAND_JSON: ${{ vars.NAPCAT_E2E_COMMAND_JSON_WINDOWS_AMD64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: napcat-windows-amd64-validation
          path: artifacts/napcat-validation.json

  napcat-e2e-linux-amd64:
    if: github.event_name == 'workflow_dispatch' && inputs.napcat_runtime_check
    runs-on: [self-hosted, linux, x64, napcat-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Run full Linux x64 NapCat lifecycle validation
        run: go run ./cmd/alx-ci verify-napcat-e2e
        env:
          NAPCAT_PLATFORM: linux-amd64
          NAPCAT_E2E_COMMAND_JSON: ${{ vars.NAPCAT_E2E_COMMAND_JSON_LINUX_AMD64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: napcat-linux-amd64-validation
          path: artifacts/napcat-validation.json

  napcat-e2e-linux-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.napcat_runtime_check
    runs-on: [self-hosted, linux, arm64, napcat-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Run full Linux ARM64 NapCat lifecycle validation
        run: go run ./cmd/alx-ci verify-napcat-e2e
        env:
          NAPCAT_PLATFORM: linux-arm64
          NAPCAT_E2E_COMMAND_JSON: ${{ vars.NAPCAT_E2E_COMMAND_JSON_LINUX_ARM64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: napcat-linux-arm64-validation
          path: artifacts/napcat-validation.json
